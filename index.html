<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura Fit - Elite</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
 --primary:#00ff88;
 --bg:#121212;
 --card:#1e1e1e;
 --text:#fff;
 --secondary:#2a2a2a;
}

body{
 font-family:sans-serif;
 background:var(--bg);
 color:var(--text);
 margin:0;
 padding-bottom:20px;
}

.container{padding:15px;}

.card{
 background:var(--card);
 border-radius:16px;
 padding:20px;
 margin-bottom:15px;
}

input,select{
 background:var(--secondary);
 color:white;
 padding:12px;
 border-radius:10px;
 width:100%;
 margin-bottom:10px;
}

.btn-main{
 background:var(--primary);
 color:#000;
 border:none;
 padding:14px;
 border-radius:10px;
 width:100%;
 font-weight:bold;
 cursor:pointer;
}

.hidden{display:none;}
.chart-area{height:200px;}
</style>
</head>

<body>

<div class="container">

<div class="card">
<label>Evolução</label>
<select id="filterSelect" onchange="updateChartData()"></select>
<div class="chart-area"><canvas id="chart"></canvas></div>
</div>

<div class="card">
<input type="text" id="exName" placeholder="Exercício">
<input type="number" id="exWeight" placeholder="Peso">
<input type="number" id="exReps" placeholder="Reps">
<button class="btn-main" onclick="save()">Salvar</button>
</div>

<div class="card">
<button class="btn-main" onclick="exportData()">Exportar Backup</button>
<input type="file" onchange="importData(this.files[0])">
</div>

</div>

<script>

let db;
let chart;

// DB
const request=indexedDB.open("AuraFitEliteDB",4);

request.onupgradeneeded=e=>{
 db=e.target.result;
 if(!db.objectStoreNames.contains("logs")){
  db.createObjectStore("logs",{keyPath:"id",autoIncrement:true});
 }
};

request.onsuccess=e=>{
 db=e.target.result;
 initChart();
 refresh();
};

// CHART
function initChart(){
 const ctx=document.getElementById('chart').getContext('2d');

 chart=new Chart(ctx,{
  type:'line',
  data:{
   labels:[],
   datasets:[{
    label:"Carga",
    data:[]
   }]
  }
 });
}

// SAVE
function save(){
 if(!db) return;

 const tx=db.transaction("logs","readwrite");

 tx.objectStore("logs").add({
  nome:exName.value,
  peso:parseFloat(exWeight.value),
  reps:parseInt(exReps.value),
  timestamp:Date.now()
 });

 tx.oncomplete=refresh;
}

// REFRESH
function refresh(){
 const store=db.transaction("logs").objectStore("logs");

 store.getAll().onsuccess=e=>{
  const data=e.target.result;

  const nomes=[...new Set(data.map(d=>d.nome))];

  filterSelect.innerHTML=nomes.map(n=>`<option>${n}</option>`);

  updateChartData();
 };
}

// CHART UPDATE
function updateChartData(){
 if(!db || !chart) return;

 const filter=filterSelect.value;

 const store=db.transaction("logs").objectStore("logs");

 store.getAll().onsuccess=e=>{
  const data=e.target.result.filter(d=>d.nome===filter);

  chart.data.labels=data.map(d=>new Date(d.timestamp).toLocaleDateString());
  chart.data.datasets[0].data=data.map(d=>d.peso);
  chart.data.datasets[0].label=filter || "Carga";

  chart.update();
 };
}

// EXPORT
function exportData(){
 const store=db.transaction("logs").objectStore("logs");

 store.getAll().onsuccess=e=>{
  const blob=new Blob([JSON.stringify(e.target.result,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="backup.json";
  a.click();
 };
}

// IMPORT (🔥 NOVO)
function importData(file){
 if(!file || !db) return;

 const reader=new FileReader();

 reader.onload=function(e){
  try{
   const data=JSON.parse(e.target.result);

   const tx=db.transaction("logs","readwrite");
   const store=tx.objectStore("logs");

   data.forEach(item=>{
    // evita duplicar pelo timestamp
    store.add(item);
   });

   tx.oncomplete=()=>{
    alert("Backup importado com sucesso!");
    refresh();
   };

  }catch(err){
   alert("Arquivo inválido");
  }
 };

 reader.readAsText(file);
}

</script>
</body>
</html>
